# Scrape the persistent worker by Docker DNS when running the root
# docker-compose.yml. The static host target remains for the standalone
# observability stack and manually launched orchestrator.

global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: propview-orchestrator
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9090
        refresh_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:9090"]
        labels:
          service: core-orchestrator
