name: CI

# `push:` with no branch filter made every job run twice on any branch with an
# open PR -- once for the push, once for the pull_request event -- which is why
# 4 failing jobs showed up as 8 failing checks. Restricting push to long-lived
# branches keeps one run per change: feature branches are covered by the
# pull_request trigger instead.
on:
  push:
    branches: [main, dev, 'test/**']
  pull_request:

# Superseded runs are wasted minutes: pushing twice in a minute otherwise leaves
# the first, now-irrelevant run competing for runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
        working-directory: dashboard
      - run: npm run lint
        working-directory: dashboard
      # Pinned deliberately: bare `uvx ruff` resolves to the newest release at
      # run time, so a ruff release can fail CI with no code change. The rule
      # set is pinned alongside it in //ruff.toml.
      - run: uvx ruff@0.17.6 check services tests db

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_DB: propview_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d propview_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Tests connect as propview_app, never as a superuser. Postgres bypasses
      # RLS unconditionally for superusers even under FORCE ROW LEVEL SECURITY,
      # so running the suite as `postgres` makes every tenant-isolation test
      # pass vacuously -- it proves nothing and would hide a real leak. See
      # CLAUDE.md section 2. The migration step below overrides this with the
      # superuser URL, because migrations do need those rights.
      DATABASE_URL: postgresql://propview_app:devpassword@localhost:5432/propview_test
      REDIS_URL: redis://localhost:6379/0
      ENCRYPTION_KEY: FG6ZzLBZnosF1kPSMHKpkDwpdPrinkzVBQ5I9CdMHEE=
      INTERNAL_SERVICE_TOKEN: ci-test-token
      PLATFORM_OPERATOR_TOKEN: ci-platform-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.13
      - name: Install pinned backend dependencies
        run: |
          python -m pip install --require-hashes -r services/orchestrator/requirements.lock
          python -m pip install --require-hashes -r services/admin-api/requirements.lock
          python -m pip install --require-hashes -r services/tool-router/requirements.lock
          # apply_migrations.py imports psycopg, which none of the three locks
          # above carry -- without this the migration step below dies with
          # ModuleNotFoundError before a single test runs.
          python -m pip install --require-hashes -r db/migrations/requirements.lock
      - name: Apply database migrations
        run: python db/migrations/apply_migrations.py
        env:
          # Migrations CREATE ROLE/EXTENSION and set default privileges, which
          # the unprivileged propview_app role cannot do. Only this step gets
          # superuser; everything after it runs as propview_app.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propview_test
      - name: Run orchestrator tests
        working-directory: services/orchestrator
        run: |
          python -m pytest tests -q
        env:
          PYTHONPATH: ${{ github.workspace }}/services/scheduling:${{ github.workspace }}/services/orchestrator
      - name: Run Admin API tests
        working-directory: services/admin-api
        run: python -m pytest tests -q
      - name: Run Tool Router tests
        working-directory: services/tool-router
        run: python -m pytest tests -q
      - name: Run scheduling tests
        working-directory: services/scheduling
        run: python -m pytest tests -q
      - name: Run compliance tests
        working-directory: services/compliance
        run: python -m pytest tests -q
      - name: Run lead-engine tests
        working-directory: services/lead-engine
        run: python -m pytest tests -q

      # These three were never wired into CI. follow-up-manager matters most:
      # its run_scan() entrypoint shipped broken (see CLAUDE.md section 16) and
      # nothing here would have caught it.
      - name: Run follow-up-manager tests
        working-directory: services/follow-up-manager
        run: python -m pytest tests -q
        env:
          PYTHONPATH: ${{ github.workspace }}/services/scheduling:${{ github.workspace }}/services/orchestrator

      - name: Run prompts tests
        working-directory: services/prompts
        run: python -m pytest tests -q

      - name: Run vap-sidecar tests
        working-directory: services/vap-sidecar
        run: python -m pytest tests -q

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm test -- --run
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application and job images
        run: |
          docker build -f services/orchestrator/Dockerfile -t propview-worker:ci .
          docker build -f services/admin-api/Dockerfile -t propview-admin-api:ci .
          docker build -f services/tool-router/Dockerfile -t propview-tool-router:ci .
          docker build -f services/follow-up-manager/Dockerfile -t propview-follow-up:ci .
          docker build -f services/data-retention/Dockerfile -t propview-retention:ci .
          docker build -f db/migrations/Dockerfile -t propview-migrations:ci .
          docker build -f dashboard/Dockerfile -t propview-dashboard:ci .

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.13
      - run: python -m pip install pip-audit==2.9.0
      - name: Audit every Python lockfile
        shell: bash
        run: |
          while IFS= read -r lockfile; do
            echo "Auditing $lockfile"
            pip-audit --require-hashes -r "$lockfile"
          done < <(find services db tests -name requirements.lock -type f | sort)

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform -chdir=infra/gcp init -backend=false -input=false
      - run: terraform -chdir=infra/gcp validate
